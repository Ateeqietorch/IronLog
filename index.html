<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#121315" />
  <title>IronLog</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body>
  <div id="app" class="app">
    <main id="view" class="view">
      <div class="splash"><div class="display">IronLog</div><div class="mut">Loading your training…</div></div>
    </main>
    <div id="rest" class="rest hidden" role="timer" aria-live="off"></div>
    <nav class="nav" aria-label="Main">
      <button data-tab="train" aria-current="page"><i class="ti ti-barbell" aria-hidden="true"></i>Train</button>
      <button data-tab="history"><i class="ti ti-calendar" aria-hidden="true"></i>History</button>
      <button data-tab="progress"><i class="ti ti-chart-line" aria-hidden="true"></i>Progress</button>
      <button data-tab="coach"><i class="ti ti-message-circle" aria-hidden="true"></i>Coach</button>
    </nav>
  </div>
  <script type="module" src="ui/app.js"></script>
</body>
</html>
